<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nepali Radio" />
  <title>📻 🇳🇵 नेपाली रेडियो संग्रह</title>

  <link rel="icon" href="/icons/favicon-32x32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0f172a" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-layout">
    
    <aside class="sidebar">
      <header class="sidebar-header">
        <h1><span class="flag">🇳🇵</span> रेडियो संग्रह</h1>
        <div class="search-container">
          <i class="fas fa-search"></i>
          <input type="text" id="search" placeholder="Search stations, places or frequency..." autocomplete="off" />
        </div>
        <div class="filter-row">
          <label class="visually-hidden" for="provinceFilter">Filter by province</label>
          <select id="provinceFilter" class="filter-select" aria-label="Filter by province">
            <option value="">All Provinces</option>
            <option value="1">Koshi</option>
            <option value="2">Madhesh</option>
            <option value="3">Bagmati</option>
            <option value="4">Gandaki</option>
            <option value="5">Lumbini</option>
            <option value="6">Karnali</option>
            <option value="7">Sudurpashchim</option>
          </select>
          <button id="favoritesToggle" class="fav-toggle-btn" type="button" aria-pressed="false" aria-label="Show favorites only">
            <i class="fas fa-heart"></i> Favorites
          </button>
        </div>
        <p id="stationCount" class="station-count" aria-live="polite"></p>
        <div id="provinceChips" class="province-chips" role="group" aria-label="Filter by province">
          <button type="button" class="province-chip active" data-value="">All</button>
          <button type="button" class="province-chip" data-value="1">Koshi</button>
          <button type="button" class="province-chip" data-value="2">Madhesh</button>
          <button type="button" class="province-chip" data-value="3">Bagmati</button>
          <button type="button" class="province-chip" data-value="4">Gandaki</button>
          <button type="button" class="province-chip" data-value="5">Lumbini</button>
          <button type="button" class="province-chip" data-value="6">Karnali</button>
          <button type="button" class="province-chip" data-value="7">Sudurpashchim</button>
        </div>
      </header>

      <section id="recentSection" class="recent-section" aria-label="Recently played stations" hidden>
        <h2 class="section-title"><i class="fas fa-clock-rotate-left"></i> Recently Played</h2>
        <div id="recentStations" class="recent-container"></div>
      </section>

      <div id="stations" class="stations-container">
        </div>

      <div class="proxy-note">
        <p>⚠️ Streams may take a few seconds to start.</p>
      </div>
    </aside>

    <main class="player-hero">
      <div class="now-playing-container">
        <div class="artwork-card">
          <img id="main-logo" src="./logo/default.jpg" alt="Station Logo">
          <div class="wave-animation" id="visualizer">
              <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
        
        <div class="station-info">
          <h2 id="nowPlayingName">Select a Station</h2>
          <p id="nowPlayingLocation">Ready to play</p>
        </div>

        <button id="eqToggle" class="eq-toggle" type="button" aria-expanded="false" aria-label="Show equalizer controls">🎚️ Tune</button>

        <div class="eq-container">
          <div class="eq-slider">
            <label for="bassSlider">Bass</label>
            <input type="range" id="bassSlider" min="-10" max="10" value="0" step="1">
          </div>
          <div class="eq-slider">
            <label for="midSlider">Mid</label>
            <input type="range" id="midSlider" min="-10" max="10" value="0" step="1">
          </div>
          <div class="eq-slider">
            <label for="trebleSlider">Treble</label>
            <input type="range" id="trebleSlider" min="-10" max="10" value="0" step="1">
          </div>
        </div>

        <div class="eq-presets" role="group" aria-label="Equalizer presets">
          <button type="button" class="preset-btn active" data-preset="flat">Flat</button>
          <button type="button" class="preset-btn" data-preset="bass">Bass Boost</button>
          <button type="button" class="preset-btn" data-preset="vocal">Vocal</button>
          <button type="button" class="preset-btn" data-preset="music">Music</button>
        </div>

        <p id="audioDiag" class="audio-diag">🔊 Engine: not started yet — play a station first</p>

        <div class="main-controls">
          <button id="prevBtn" class="nav-btn" aria-label="Previous"><i class="fas fa-step-backward"></i></button>

          <button id="playPauseBtn" class="play-trigger" aria-label="Play/Pause">
            <i id="playIcon" class="fas fa-play"></i>
          </button>

          <button id="nextBtn" class="nav-btn" aria-label="Next"><i class="fas fa-step-forward"></i></button>
        </div>

        <div class="player-tools">
          <button id="shuffleBtn" class="tool-btn" type="button" aria-label="Play a random station">
            <i class="fas fa-shuffle"></i> Surprise Me
          </button>
          <button id="shareBtn" class="tool-btn" type="button" aria-label="Share this station">
            <i class="fas fa-share-nodes"></i> <span id="shareBtnLabel">Share</span>
          </button>
          <div class="sleep-box">
            <label for="sleepTimerSelect"><i class="fas fa-moon"></i> Sleep</label>
            <select id="sleepTimerSelect" class="filter-select" aria-label="Sleep timer">
              <option value="0">Off</option>
              <option value="15">15 min</option>
              <option value="30">30 min</option>
              <option value="45">45 min</option>
              <option value="60">60 min</option>
            </select>
            <span id="sleepTimerStatus" class="sleep-status" aria-live="polite"></span>
          </div>
        </div>

        <div class="volume-box">
          <i class="fas fa-volume-low"></i>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
          <i class="fas fa-volume-high"></i>
        </div>
      </div>
    </main>

  </div>

  <div id="miniPlayer" class="mini-player" hidden>
    <img id="miniLogo" src="./logo/default.jpg" alt="">
    <div class="mini-info">
      <span id="miniName" class="mini-name"></span>
      <span id="miniMeta" class="mini-meta"></span>
    </div>
    <button id="miniPrev" class="mini-btn" type="button" aria-label="Previous station"><i class="fas fa-step-backward"></i></button>
    <button id="miniPlay" class="mini-play" type="button" aria-label="Play/Pause"><i id="miniPlayIcon" class="fas fa-play"></i></button>
    <button id="miniNext" class="mini-btn" type="button" aria-label="Next station"><i class="fas fa-step-forward"></i></button>
  </div>

  <audio id="player" preload="none" playsinline crossorigin="anonymous"></audio>

  <script src="script.js" defer></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('✅ SW Registered'))
          .catch(err => console.error('❌ SW Failed', err));
      });
    }
  </script>
</body>
</html>
